# Publish to PyPI on a version tag.
#
# ─────────────────────────────────────────────────────────────────────────────────────
#  ARMED: the publish jobs run on every v* tag. The setup below must exist first;
#  RELEASING.md walks through it.
#
#  The `publish-*` jobs below shipped commented out, because Trusted Publishing cannot be
#  verified from a developer machine — it needs a publisher registered on PyPI against
#  this exact repository, workflow filename and environment name, and there is no way
#  to test that without attempting a real upload. Arming it without that registration
#  produces a failed release on the first tag, which is the worst moment to find out.
#
#  What arming it required (done once):
#
#   1. On PyPI, create the project's *pending* publisher
#      (https://pypi.org/manage/account/publishing/) with exactly:
#         PyPI project name : django-vantage
#         Owner             : Pythondeveloper6
#         Repository        : django-vantage
#         Workflow name     : release.yml
#         Environment name  : pypi
#      Do the same on test.pypi.org with environment name `testpypi`.
#   2. In this repository, create environments named `pypi` and `testpypi`
#      (Settings → Environments). Add required reviewers to `pypi` if you want a human
#      to approve every upload — recommended, and it costs one click per release.
#   3. Uncomment the two publish jobs.
#   4. Tag a `.dev` or `rc` version first and watch it land on TestPyPI before tagging
#      a real one. A version number on PyPI can never be reused, only yanked.
#
#  No API token is involved anywhere in this file, and none should be added. A token in
#  repository secrets is a long-lived credential that publishes on behalf of a human;
#  Trusted Publishing mints a short-lived one scoped to this workflow.
# ─────────────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"
  # Lets the build-and-verify half be exercised without cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No cache in the release job: a cache entry written by any other workflow
          # run would otherwise feed straight into the artefacts that get published.
          enable-cache: false
          python-version: "3.13"

      # A tag that disagrees with the version in the package is how a release gets
      # published under the wrong number, and it is unfixable afterwards.
      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(uv run --no-project --with . python -c "import vantage; print(vantage.__version__)")
          echo "tag=$tag packaged=$packaged"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match vantage.__version__ ($packaged)"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      # Same gate as CI. A release is exactly the moment a wheel missing its templates
      # would go unnoticed, because nobody renders a page before uploading.
      - name: Verify the wheel is complete and installable
        run: uv run --no-project python scripts/verify_wheel.py dist/*.whl --python 3.13

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-vantage
    permissions:
      # The OIDC token Trusted Publishing exchanges for a short-lived upload token.
      # Nothing else in this job needs a permission, so nothing else is granted.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-tagging after a failed run should not be blocked by the half that
          # already uploaded.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/django-vantage
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PEP 740 attestations, signed by the same OIDC identity. Free provenance.
          attestations: true

  github-release:
    name: Attach the distributions to the GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in this release."
