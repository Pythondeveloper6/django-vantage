# Continuous integration.
#
# Lint, the test matrix (SQLite), the browser layer, the type check (advisory), the
# packaging check, then the same suite on PostgreSQL and MySQL, a coverage floor and a
# dependency vulnerability audit.
#
# The packaging job is the one worth explaining. `vantage` is mostly not Python — 30
# templates, 16 static files, a templatetags module — and every one is located by path
# at runtime rather than imported. A wheel that dropped them would still import, still
# pass `twine check`, still install cleanly, and 500 on the first page view. So the job
# installs the built wheel into an empty virtualenv and renders a template out of it.
#
# The browser job is the other one worth explaining. `tests/test_browser.py` is
# `pytest.importorskip`'d and marked `browser`, so the main `test` job above collects
# it and skips it cleanly (no Chromium there) rather than ignoring it outright — this
# job is what actually runs it, against a `pytest-django` `live_server` it boots
# itself, needing neither the demo project nor a server anyone had to remember to
# start.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push should not leave the previous run burning minutes on a dead commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run --no-sync ruff check src tests

      # Blocking since the tree was formatted in one commit (listed in
      # .git-blame-ignore-revs, so blame skips it).
      - name: ruff format
        run: uv run --no-sync ruff format --check --diff src tests

  test:
    name: py${{ matrix.python-version }} · Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    # Matrix values reach the shell through the environment, never by expanding
    # `${{ }}` inside a script, so a value can never become shell syntax.
    env:
      DJANGO_CELL: ${{ matrix.django }}
      PYTHON_CELL: ${{ matrix.python-version }}
    strategy:
      # One red cell should not hide the other nine.
      fail-fast: false
      matrix:
        # Every Django the classifiers name, on every interpreter the package claims.
        # A classifier is a promise; 6.0 used to be skipped as "between two tested
        # versions", which is reasoning, not evidence.
        python-version: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
        experimental: [false]
        include:
          # Django main is 6.2 development. It exists to give advance warning of a
          # deprecation, not to gate a merge, so it is allowed to fail and runs on one
          # interpreter only — a break on main is a break on all three.
          - python-version: "3.14"
            django: "main"
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The matrix carries a version, not a requirement string, so the job name reads
      # "Django 5.2" instead of "Django django>=5.2,<6.0". The mapping lives here.
      - name: Resolve the Django requirement
        run: |
          case "$DJANGO_CELL" in
            5.2)  spec="django>=5.2,<6.0" ;;
            6.0)  spec="django>=6.0,<6.1" ;;
            6.1)  spec="django>=6.1,<6.2" ;;
            main) spec="https://github.com/django/django/archive/refs/heads/main.tar.gz" ;;
            *)    echo "::error::unknown Django cell '$DJANGO_CELL'"; exit 1 ;;
          esac
          echo "DJANGO_SPEC=$spec" >> "$GITHUB_ENV"

      - name: Create the environment
        run: uv venv --python "$PYTHON_CELL"

      # Installed non-editable on purpose: the suite then imports `vantage` out of
      # site-packages rather than out of `src/`, so it exercises the built artefact and
      # a template left out of the build fails a test rather than surviving to a
      # release. `tests/` still resolves through pytest's `pythonpath = ["."]`.
      # Django is named last so this cell's version wins over whatever single version
      # the lockfile happens to hold.
      #
      # Django main is the next version, which the package's own upper bound excludes
      # on purpose, so that cell overrides the bound rather than asking for something
      # the resolver must refuse. Every other cell installs under the real bound.
      - name: Install
        run: |
          if [ "$DJANGO_CELL" = "main" ]; then
            echo "django @ $DJANGO_SPEC" > "$RUNNER_TEMP/django-override.txt"
            uv pip install . --group dev --override "$RUNNER_TEMP/django-override.txt"
          else
            uv pip install . --group dev "$DJANGO_SPEC"
          fi

      - name: Report the resolved versions
        run: |
          uv run --no-sync python -c "import sys; print('Python', sys.version)"
          uv run --no-sync python -c "import django; print('Django', django.get_version())"

      # Plain `pytest`. There is a machine-level hook on one contributor's workstation
      # that requires an `ALLOW_TESTS=1` prefix; that is local to that machine and has
      # no business here.
      - name: pytest
        run: uv run --no-sync pytest

  browser:
    name: browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - run: uv sync --group dev --group browser --frozen

      # `--with-deps` also installs the OS packages Chromium needs on a bare runner
      # image; `enable-cache` above only caches uv's own downloads, not this.
      - name: Install Chromium
        run: uv run --no-sync playwright install --with-deps chromium

      # `-m browser` rather than a plain `pytest`: the main `test` job above already
      # collects tests/test_browser.py and skips it (no Chromium there), so running
      # the whole suite here too would just repeat 3400+ tests this job adds nothing
      # to. Everything else stays deselected by the marker, not by path, so a
      # contributor who adds a second browser-marked file needs no workflow change.
      - name: pytest -m browser
        run: uv run --no-sync pytest -m browser

  typecheck:
    # Advisory, and honestly so. `ty` reports a few hundred diagnostics against src/
    # today (387 with ty 0.0.91), the bulk of them `unresolved-attribute` on
    # Django model and queryset descriptors that no static checker resolves without
    # stubs. Publishing the number and letting it be driven down is worth more than a
    # green tick over a check nobody runs.
    #
    # mypy was the alternative and was rejected: making it say anything useful about a
    # Django codebase needs django-stubs, which pins the Django version it models — so
    # it would either contradict the 5.2/6.1/main matrix or have to be pinned to one
    # cell of it. `ty` needs no stubs and no pin.
    name: ty (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - run: uv sync --group dev --frozen

      # Pinned, so the count moves when the code does and not when ty learns a new
      # check. Bump it deliberately and note the new baseline above.
      - name: ty check
        run: uv run --no-sync --with "ty==0.0.91" ty check src

  build:
    name: build & wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout pushes; leave no token in .git/config.
          persist-credentials: false
          # setuptools-scm is not in use, but a shallow clone also hides the tags that
          # make `git describe` meaningful in a failure report.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Build
        run: uv build

      - name: twine check
        run: uvx twine check --strict dist/*

      # The real check: install the wheel into an empty venv, boot Django with `vantage`
      # in INSTALLED_APPS, compile every shipped template through the app-dirs loader,
      # render one for real, and resolve the static files through the finder. Run from a
      # scratch directory so `src/` cannot stand in for anything the wheel left out.
      - name: Verify the wheel is complete and installable
        run: uv run --no-project python scripts/verify_wheel.py dist/*.whl --python 3.13

      - name: List what shipped
        run: |
          echo '### Wheel contents' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project python -m zipfile -l dist/*.whl >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  databases:
    # The main matrix runs on SQLite. These two cells run the whole suite against a real
    # PostgreSQL and MySQL, where the planner estimates, statement timeouts, keyset
    # paging and case-sensitivity rules actually execute instead of being simulated.
    name: ${{ matrix.database }} · py3.13 · Django 6.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vantage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vantage
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      VANTAGE_TEST_DB: ${{ matrix.database }}
      PGHOST: localhost
      PGPORT: "5432"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Install
        run: |
          uv venv
          uv pip install . --group dev "django>=6.1,<6.2" "psycopg[binary]>=3.2" "mysqlclient>=2.2"

      - name: pytest
        run: uv run --no-sync pytest -p no:cacheprovider

  coverage:
    # A floor, not a target: it fails a change that deletes tests or adds a large
    # untested module, and is raised as coverage rises.
    name: coverage (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - run: uv sync --group dev --frozen

      - name: pytest with coverage
        run: uv run --no-sync pytest --cov=vantage --cov-report=term-missing:skip-covered --cov-fail-under=90

  audit:
    # Known-vulnerable pins in the lockfile fail the build. The runtime dependency is
    # Django alone; the rest are development tools, audited because they run in CI.
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"

      - name: pip-audit
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-project --no-header --color never > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.9.0 --strict -r "$RUNNER_TEMP/requirements.txt"
