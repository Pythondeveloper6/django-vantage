[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "django-vantage"
dynamic = ["version", "readme"]
description = "A smart, beautiful admin panel for Django. Zero config to start, one line to override anything."
requires-python = ">=3.12"
license = "MIT"
# PEP 639: naming the file explicitly keeps the licence in the wheel's
# `.dist-info/licenses/` rather than relying on the backend guessing at a filename.
license-files = ["LICENSE"]
authors = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
maintainers = [{ name = "Mahmoud Ahmed", email = "pythondeveloper6@gmail.com" }]
# Keywords describe what the package IS. It ships no htmx and no Tailwind — the CSS is
# hand-written OKLCH tokens and the JavaScript is dependency-free, which is the point of
# "no Node.js" in the README, so naming those two frameworks here would mislead search.
keywords = [
    "django",
    "django-admin",
    "admin",
    "admin-panel",
    "admin-interface",
    "backoffice",
    "dashboard",
    "crud",
    "data-grid",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    # No `License ::` classifier on purpose. PEP 639 deprecated them in favour of the
    # `license` SPDX expression above, and carrying both is contradictory metadata.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Upper-bounded on purpose: the bound moves only in the commit that adds the next Django
# to the CI matrix, so pip can never pair this release with a Django nobody tested.
dependencies = ["Django>=5.2,<6.2"]

[project.urls]
Homepage = "https://github.com/Pythondeveloper6/django-vantage"
Documentation = "https://pythondeveloper6.github.io/django-vantage/"
Source = "https://github.com/Pythondeveloper6/django-vantage"
Issues = "https://github.com/Pythondeveloper6/django-vantage/issues"
Changelog = "https://github.com/Pythondeveloper6/django-vantage/blob/main/CHANGELOG.md"
Contributing = "https://github.com/Pythondeveloper6/django-vantage/blob/main/CONTRIBUTING.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "model-bakery>=1.20",
    # Optional at runtime (see vantage.media.has_pillow) but needed here so the
    # with-Pillow code paths in tests/test_media.py are actually exercised.
    "Pillow>=10.0",
]
# Release plumbing, kept out of `dev` so a contributor's `uv sync` stays small.
release = ["build>=1.2", "twine>=6.0"]
# The browser layer (tests/test_browser.py). Kept out of `dev` on purpose: it drags
# in Chromium, which `dev` never has and which nothing else in the suite needs — a
# contributor running the whole thing with `uv sync --group dev` still gets a
# complete, green suite with these tests cleanly skipped (see the module docstring).
# `uv sync --group dev --group browser` plus `uv run playwright install chromium`
# opts in.
browser = ["playwright>=1.40"]
docs = [
    "mkdocs-material>=9.5",
]

# One source for the version: vantage.__version__, which the release workflow also
# checks the tag against.
# The README's images use repository-relative paths, so GitHub renders them on any
# branch and while the repository is private. PyPI has no repository to resolve them
# against, so the published description gets absolute URLs instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src(?:set)?=")(docs/assets/)'
replacement = '\1https://raw.githubusercontent.com/Pythondeveloper6/django-vantage/main/\2'

[tool.hatch.version]
path = "src/vantage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vantage"]
# Belt and braces. Hatchling honours `.gitignore` when it can see one, but an sdist
# rebuild or an export without VCS metadata cannot, and shipping another interpreter's
# bytecode is both dead weight and a source of confusing import behaviour.
# docs/assets holds the screenshots and logos for the README and the docs site, which
# load them from GitHub; they are a megabyte nobody installing from source needs.
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store", "/docs/assets"]
# `locale/**/*.mo` is tracked in git (see .gitignore), so this is redundant today —
# but hatchling's default file selection is "whatever VCS is not ignoring", and that
# default silently drops compiled catalogues the moment someone gitignores *.mo
# without noticing they also stopped shipping. `artifacts` is not subject to that
# default, so translations keep shipping even if the git-tracking decision changes.
# Verified by building a wheel and inspecting it, not by reasoning about this
# config: see tests/test_i18n.py::TestCompiledCataloguesShipInTheWheel.
artifacts = ["*.mo"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor these at the project root. Without them hatchling applies
# gitignore matching semantics, so a bare `README.md` also swept in `example/README.md`.
#
# `tests/` and `tox.ini` are here on purpose: distribution packagers (Debian, Fedora,
# conda-forge) build from the sdist and run the suite from it, and a package whose tests
# cannot be run downstream gets shipped untested or not at all. `example/` is omitted —
# it carries a seeded SQLite database and serves no one installing from source.
artifacts = ["*.mo"]
include = [
    "/src/vantage",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/tox.ini",
]
# docs/assets holds the screenshots and logos for the README and the docs site, which
# load them from GitHub; they are a megabyte nobody installing from source needs.
exclude = ["**/__pycache__", "**/*.py[cod]", "**/.DS_Store", "/docs/assets"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "browser: drives a real Chromium via Playwright against a pytest-django live_server. Needs the `browser` dependency group (`uv sync --group dev --group browser`) and `uv run playwright install chromium`; skips cleanly when either is missing.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "RUF", "S"]
# RUF012: declarative class attributes are the idiom in both Django and this package's
# own ModelPanel API; annotating every one with ClassVar would be noise.
# S110/S112: a swallowed exception is this package's deliberate fail-soft pattern (an
# audit write must not fail the save it records, a broken plugin must not take a page
# down); each one carries its reason beside it. Every other bandit rule is enforced,
# and a reviewed exception is a line-level `noqa` with the reason next to it.
ignore = ["B008", "RUF012", "S110", "S112"]

[tool.ruff.lint.isort]
known-first-party = ["vantage"]

[tool.ruff.lint.per-file-ignores]
# Throwaway models declared inside a test to exercise one introspection edge case
# do not need a __str__.
"tests/test_*.py" = ["DJ008"]
# Tests assert, hard-code throwaway passwords and build hostile payloads on purpose.
"tests/**/*.py" = ["S"]
# Inline SVG path data is one long literal per icon; wrapping it would corrupt it.
"src/vantage/templatetags/vantage.py" = ["E501", "RUF003"]
# Migrations are generated; reformatting them by hand invites drift from what
# makemigrations would produce next time.
"src/vantage/migrations/*.py" = ["E501", "RUF012"]
