# The support matrix, runnable locally.
#
# Why tox and not nox: the matrix here is a plain cross-product — three interpreters by
# two Django versions, plus one allowed-to-fail cell — with no branching, no computed
# environments and no per-env Python logic. tox's factor syntax states that in a dozen
# declarative lines; nox would state the same thing as a parametrised function, which
# is more code for a case that has no code in it. nox earns its keep when environments
# need real logic, and this one does not.
#
# `tox-uv` swaps tox's virtualenv/pip for uv, so a local matrix run uses the same
# installer and the same resolver as CI. Nothing needs to be installed to use this:
#
#     uvx --with tox-uv tox              # the whole matrix
#     uvx --with tox-uv tox -e py313-dj52
#     uvx --with tox-uv tox -e lint,type
#     uvx --with tox-uv tox -e py313-dj61 -- -k inference -x
#
# Interpreters are not a prerequisite either — uv downloads any of 3.12/3.13/3.14 it
# cannot find, so the matrix runs on a machine that has only one Python.

[tox]
requires =
    tox>=4.22
    tox-uv>=1.16
env_list =
    lint
    py{312,313,314}-dj{52,61}
    py313-djmain
    build
# A missing interpreter should be reported, not silently skipped into a green run.
skip_missing_interpreters = false

[testenv]
description = pytest on {basepython} against Django {env:DJANGO_LABEL:?}
runner = uv-venv-runner
# `wheel` rather than `editable`: the suite then runs against the artefact that would
# ship, so a template left out of the build fails here rather than after upload.
package = wheel
wheel_build_env = .pkg
dependency_groups = dev
deps =
    dj52: django>=5.2,<6.0
    dj61: django>=6.1,<6.2
    # Django main is 6.2 development. It is here for advance warning of a deprecation,
    # never as a merge gate — see `ignore_outcome` below.
    djmain: django @ https://github.com/django/django/archive/refs/heads/main.tar.gz
set_env =
    dj52: DJANGO_LABEL = 5.2
    dj61: DJANGO_LABEL = 6.1
    djmain: DJANGO_LABEL = main
    PYTHONDEVMODE = 1
commands_pre =
    python -c "import django; print('Django', django.get_version())"
commands =
    pytest {posargs}

[testenv:py313-djmain]
description = pytest against Django main — advisory, a failure here does not fail tox
# The point of tracking main is to see a deprecation coming, and a red bar that is
# expected to be red teaches people to ignore the bar.
ignore_outcome = true

[testenv:lint]
description = ruff, exactly as CI runs it
runner = uv-venv-runner
skip_install = true
dependency_groups = dev
commands =
    ruff check src tests
    # Advisory here too. `ruff format` has never been applied to this repository, so it
    # currently reports most of the tree. Drop the `-` prefix in the same commit that
    # formats it.
    -ruff format --check src tests

[testenv:type]
description = ty — advisory, the codebase does not type-check cleanly yet
runner = uv-venv-runner
skip_install = true
dependency_groups = dev
deps = ty
ignore_outcome = true
commands = ty check src

[testenv:build]
description = build the distributions and prove the wheel is complete
runner = uv-venv-runner
skip_install = true
deps = twine
# `uv build` rather than `python -m build`: same builder as CI, and it needs no
# bootstrap environment of its own.
allowlist_externals = uv
change_dir = {toxinidir}
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    uv build
    # twine expands the glob itself, so this does not depend on a shell.
    twine check --strict dist{/}*
    # The check nothing else performs: install the wheel somewhere empty and render a
    # template out of it. See the docstring in scripts/verify_wheel.py.
    python {toxinidir}{/}scripts{/}verify_wheel.py --python 3.13 {posargs:dist}
