# Optional but recommended: `uvx pre-commit install`.
#
# The rule this file follows is that a hook must either be something CI also gates on,
# or something with no plausible false positive. A hook that fails for a reason CI does
# not care about trains people to pass --no-verify, which costs more than it saves.
default_language_version:
  python: python3.13

# The hooks only ever see staged files, so enabling one does not rewrite the tree.
exclude: '^(example/db\.sqlite3|\.venv/|uv\.lock)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        # Markdown uses two trailing spaces as a hard line break.
        args: [--markdown-linebreak-ext=md]
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # The lint gate, identical to CI's.
      - id: ruff-check
        args: [--fix]

      # `ruff format` has never been applied to this repository — running it today
      # reports most of the tree — so it is off rather than pretending. Because
      # pre-commit only touches staged files, enabling it would reformat whatever you
      # happen to be editing and bury your change in a whitespace diff. Turn it on in
      # the same commit that formats the tree and makes CI's advisory step blocking.
      # - id: ruff-format

  # Catches the class of mistake that only shows up in a GitHub Actions run, where the
  # feedback loop is minutes rather than seconds.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
